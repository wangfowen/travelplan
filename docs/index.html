<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel briefs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<style>
  :root {
    --bg: #eef1f0;
    --surface: #ffffff;
    --surface-2: #e6eae9;
    --ink: #14181b;
    --muted: #5a6a6d;
    --accent: #0d6e6e;
    --line: #d3dbd9;
    --tag-bg: #dcecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101414;
      --surface: #182020;
      --surface-2: #1e2727;
      --ink: #e6ecea;
      --muted: #8fa09e;
      --accent: #56c4b6;
      --line: #263130;
      --tag-bg: #17302e;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2.25rem 1.1rem 3.5rem;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 34rem;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  header { display: flex; flex-direction: column; gap: .45rem; }
  h1 {
    margin: 0;
    font-size: clamp(1.7rem, 7vw, 2.15rem);
    letter-spacing: -.03em;
    line-height: 1.05;
    text-wrap: balance;
  }
  .tally {
    font-size: .74rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  section { display: flex; flex-direction: column; gap: 0; }
  h2 {
    margin: 0 0 .25rem;
    font-size: .74rem;
    letter-spacing: .13em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
    padding-bottom: .4rem;
    border-bottom: 1px solid var(--line);
  }

  .row {
    display: flex;
    align-items: baseline;
    gap: .7rem;
    padding: .95rem .2rem;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
  }
  .row:last-of-type { border-bottom: 0; }
  .row:hover .trip { color: var(--accent); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .trip { font-size: 1.05rem; font-weight: 580; letter-spacing: -.012em; }
  .row.latest .trip { font-size: 1.16rem; font-weight: 640; }
  .spacer { flex: 1; }
  .pub { font-size: .76rem; color: var(--muted); white-space: nowrap; }

  .tag {
    font-size: .62rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--accent);
    background: var(--tag-bg);
    border-radius: 2px;
    padding: .14rem .38rem;
    white-space: nowrap;
  }
  .tag.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    font-weight: 500;
  }

  .empty, .error {
    color: var(--muted);
    font-size: .9rem;
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 1rem;
  }

  footer {
    font-size: .82rem;
    line-height: 1.6;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 1.1rem;
    display: flex;
    flex-direction: column;
    gap: .55rem;
  }
  footer b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Travel briefs</h1>
    <div class="tally mono" id="tally">loading…</div>
  </header>

  <div id="list"><noscript><p class="error">This index needs JavaScript — or read <a href="manifest.json">manifest.json</a> directly.</p></noscript></div>

  <footer>
    <span><b>Add to Home Screen</b> to keep every guide one tap away.</span>
    <span>Trip guides are traveler-tested after the trip; briefs are pre-trip research. Every version is kept — the newest per city is marked.</span>
  </footer>
</main>

<script>
(async () => {
  const list = document.getElementById('list');
  const tally = document.getElementById('tally');
  let manifest;
  try {
    const res = await fetch('manifest.json', { cache: 'no-cache' });
    manifest = await res.json();
  } catch (e) {
    tally.textContent = '—';
    list.innerHTML = '<p class="error">Could not load manifest.json.</p>';
    return;
  }

  const entries = (manifest.entries || []).slice().reverse(); // newest first
  if (!entries.length) {
    tally.textContent = 'no guides yet';
    list.innerHTML = '<p class="empty">Nothing published yet — run /travel-brief from Claude Code.</p>';
    return;
  }

  const briefs = entries.filter(e => e.type === 'brief').length;
  const summaries = entries.filter(e => e.type === 'summary').length;
  const cities = [...new Set(entries.map(e => e.city))];
  tally.textContent = `${briefs} brief${briefs === 1 ? '' : 's'}`
    + (summaries ? ` · ${summaries} trip guide${summaries === 1 ? '' : 's'}` : '')
    + ` · ${cities.length} destination${cities.length === 1 ? '' : 's'}`;

  const frag = document.createDocumentFragment();
  for (const city of cities) {
    const section = document.createElement('section');
    const h2 = document.createElement('h2');
    h2.textContent = city;
    section.appendChild(h2);

    const cityEntries = entries.filter(e => e.city === city);
    // summaries first (they're the finished product), then briefs newest-first
    const ordered = [
      ...cityEntries.filter(e => e.type === 'summary'),
      ...cityEntries.filter(e => e.type !== 'summary'),
    ];
    let latestBriefSeen = false;
    for (const e of ordered) {
      const a = document.createElement('a');
      a.className = 'row';
      a.href = e.file;

      const trip = document.createElement('span');
      trip.className = 'trip';
      trip.textContent = e.trip && e.trip !== 'unknown' ? e.trip : (e.city + ' brief');
      a.appendChild(trip);

      if (e.type === 'summary') {
        const t = document.createElement('span');
        t.className = 'tag';
        t.textContent = 'Trip guide';
        a.appendChild(t);
      } else if (!latestBriefSeen) {
        latestBriefSeen = true;
        a.classList.add('latest');
        const t = document.createElement('span');
        t.className = 'tag ghost';
        t.textContent = 'Latest';
        a.appendChild(t);
      }

      const spacer = document.createElement('span');
      spacer.className = 'spacer';
      a.appendChild(spacer);

      const pub = document.createElement('span');
      pub.className = 'pub mono';
      pub.textContent = e.published || '';
      a.appendChild(pub);

      section.appendChild(a);
    }
    frag.appendChild(section);
  }
  list.replaceChildren(frag);
})();
</script>
</body>
</html>
