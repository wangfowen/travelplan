<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel briefs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<style>
  :root {
    --bg: #eef1f0;
    --surface: #ffffff;
    --ink: #14181b;
    --muted: #5a6a6d;
    --accent: #0d6e6e;
    --line: #d3dbd9;
    --tag-bg: #dcecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101414;
      --surface: #182020;
      --ink: #e6ecea;
      --muted: #8fa09e;
      --accent: #56c4b6;
      --line: #263130;
      --tag-bg: #17302e;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2.25rem 1.1rem 3.5rem;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 34rem;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.6rem;
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  header { display: flex; flex-direction: column; gap: .45rem; margin-bottom: .4rem; }
  h1 {
    margin: 0;
    font-size: clamp(1.7rem, 7vw, 2.15rem);
    letter-spacing: -.03em;
    line-height: 1.05;
  }
  .tally {
    font-size: .74rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .city-block {
    border-bottom: 1px solid var(--line);
    padding-bottom: 1.35rem;
    display: flex;
    flex-direction: column;
    gap: .45rem;
  }
  .city-block:last-of-type { border-bottom: 0; }

  a.city {
    display: block;
    text-decoration: none;
    color: inherit;
    font-size: 1.55rem;
    font-weight: 650;
    letter-spacing: -.02em;
    line-height: 1.2;
    padding: .15rem 0;
  }
  a.city:hover, a.city:active { color: var(--accent); }
  a.city:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  details { margin-top: .1rem; }
  summary {
    cursor: pointer;
    font-size: .72rem;
    color: var(--muted);
    letter-spacing: .04em;
    -webkit-user-select: none;
    user-select: none;
  }
  summary:hover { color: var(--accent); }
  details a.old {
    display: block;
    font-size: .78rem;
    color: var(--muted);
    text-decoration: none;
    padding: .32rem 0 .32rem .85rem;
  }
  details a.old:hover { color: var(--accent); }

  .empty, .error {
    color: var(--muted);
    font-size: .9rem;
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 1rem;
  }

  footer {
    font-size: .8rem;
    line-height: 1.6;
    color: var(--muted);
    padding-top: .4rem;
  }
  footer b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Travel briefs</h1>
    <div class="tally mono" id="tally">loading…</div>
  </header>

  <div id="list" style="display: contents"><noscript><p class="error">This index needs JavaScript — or read <a href="manifest.json">manifest.json</a> directly.</p></noscript></div>

  <footer><b>Add to Home Screen</b> to keep every guide one tap away.</footer>
</main>

<script>
(async () => {
  const list = document.getElementById('list');
  const tally = document.getElementById('tally');
  let manifest;
  try {
    const res = await fetch('manifest.json', { cache: 'no-cache' });
    manifest = await res.json();
  } catch (e) {
    tally.textContent = '—';
    list.innerHTML = '<p class="error">Could not load manifest.json.</p>';
    return;
  }

  const entries = (manifest.entries || []).slice().reverse(); // newest first
  if (!entries.length) {
    tally.textContent = 'no guides yet';
    list.innerHTML = '<p class="empty">Nothing published yet — run /travel-brief from Claude Code.</p>';
    return;
  }

  const cities = [...new Set(entries.map(e => e.city))];
  tally.textContent = `${cities.length} destination${cities.length === 1 ? '' : 's'}`;

  const label = e => {
    const parts = [e.type === 'summary' ? 'trip guide' : 'brief'];
    if (e.trip && e.trip !== 'unknown') parts.push(e.trip);
    if (e.published) parts.push('published ' + e.published);
    return parts.join(' · ');
  };

  const frag = document.createDocumentFragment();
  for (const city of cities) {
    const cityEntries = entries.filter(e => e.city === city); // newest first
    // a trip guide (post-trip, traveler-tested) supersedes the brief as the city's main link
    const main0 = cityEntries.find(e => e.type === 'summary') || cityEntries[0];
    const older = cityEntries.filter(e => e !== main0);

    const block = document.createElement('div');
    block.className = 'city-block';

    const main = document.createElement('a');
    main.className = 'city';
    main.href = main0.file;
    main.textContent = city;
    block.appendChild(main);

    if (older.length) {
      const det = document.createElement('details');
      const sum = document.createElement('summary');
      sum.textContent = `${older.length} older version${older.length === 1 ? '' : 's'}`;
      det.appendChild(sum);
      for (const e of older) {
        const a = document.createElement('a');
        a.className = 'old mono';
        a.href = e.file;
        a.textContent = label(e);
        det.appendChild(a);
      }
      block.appendChild(det);
    }

    frag.appendChild(block);
  }
  list.replaceChildren(frag);
})();
</script>
</body>
</html>
